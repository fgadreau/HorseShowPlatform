name: Veterinary PREPROD verification
on:
  workflow_dispatch:
  push:
    branches: [preprod]
    paths: ["src/features/vet/**", "src/services/vet*", "supabase/migrations/*vet*.sql", ".github/workflows/vet-preprod-smoke.yml"]
permissions:
  contents: read
concurrency:
  group: vet-preprod-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref_name == 'preprod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preprod
    env:
      E2E_ALLOW_WRITES: "true"
      E2E_DEPLOY_ENV: staging
      E2E_BASE_URL: ${{ vars.PREPROD_HSP_URL }}
      E2E_SUPABASE_PROJECT_REF: ${{ vars.PREPROD_SUPABASE_PROJECT_REF }}
      E2E_SUPABASE_URL: ${{ vars.PREPROD_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREPROD_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREPROD_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/vet/preprod-smoke.mjs
