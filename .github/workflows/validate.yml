name: Validate HSP

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - rebuild/discipline-directories-health

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:draw
      - run: npm run test:payout
      - run: npm run test:identity
      - run: npm run test:governing
      - run: npm run test:eligibility
