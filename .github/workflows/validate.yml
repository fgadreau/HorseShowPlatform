name: Validate HSP

on:
  pull_request:
  push:
    branches:
      - main
      - preprod
      - staging
      - rebuild/discipline-directories-health

permissions:
  contents: read

jobs:
  promotion-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require preprod as the production source
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: test "$SOURCE_BRANCH" = "preprod"

  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:draw
      - run: npm run test:payout
      - run: npm run test:identity
      - run: npm run test:governing
      - run: npm run test:eligibility
      - run: npm run test:vet
      - name: Verify immutable production migration chain
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          git fetch origin main
          npm run test:promotion
